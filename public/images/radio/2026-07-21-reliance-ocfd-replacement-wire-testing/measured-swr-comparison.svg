<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title description">
  <title id="title">Measured in-band SWR for three Reliance OCFD wire assemblies</title>
  <desc id="description">A grouped dot plot comparing the original wire, green 80/20 replacement, and orange 64/36 replacement on 40, 20, 15, and 10 meters. Orange has the lowest measured SWR on 40 and 20 meters, green on 15 meters, and the original narrowly on 10 meters.</desc>
  <style>
    .title { font: 800 31px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172026; }
    .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5f6f79; }
    .legend { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172026; }
    .tick, .frequency, .footnote { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5f6f79; }
    .band { font: 800 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172026; }
    .frequency { font-size: 12px; }
    .value { font: 800 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect width="960" height="760" rx="16" fill="#fffdfa" />
  <rect x="230" y="155" width="167.5" height="513" fill="#edf5f0" />
  <text x="44" y="52" class="title">Measured in-band SWR</text>
  <text x="44" y="80" class="subtitle">Original wire and two untrimmed replacements</text>
  
        <circle cx="437" cy="91" r="7" fill="#5f6f79" />
        <text x="451" y="96" class="legend">Original</text>
        <polygon points="607,84 614,91 607,98 600,91" fill="#2f6f4e" />
        <text x="621" y="96" class="legend">Green 80/20</text>
        <rect x="770" y="84" width="14" height="14" rx="2" fill="#d46b28" />
        <text x="791" y="96" class="legend">Orange 64/36</text>
  <text x="313.75" y="173" text-anchor="middle" class="frequency" fill="#2f6f4e">≤ 2:1</text>
  
        <line x1="230" y1="155" x2="230" y2="668" stroke="#d9ded8" stroke-width="1" />
        <text x="230" y="143" text-anchor="middle" class="tick">1:1</text>
        <line x1="397.5" y1="155" x2="397.5" y2="668" stroke="#8ba79a" stroke-width="2" />
        <text x="397.5" y="143" text-anchor="middle" class="tick">2:1</text>
        <line x1="565" y1="155" x2="565" y2="668" stroke="#d9ded8" stroke-width="1" />
        <text x="565" y="143" text-anchor="middle" class="tick">3:1</text>
        <line x1="732.5" y1="155" x2="732.5" y2="668" stroke="#d9ded8" stroke-width="1" />
        <text x="732.5" y="143" text-anchor="middle" class="tick">4:1</text>
        <line x1="900" y1="155" x2="900" y2="668" stroke="#d9ded8" stroke-width="1" />
        <text x="900" y="143" text-anchor="middle" class="tick">5:1</text>
  
        <g>
          <text x="44" y="209" class="band">40 m</text>
          <text x="44" y="231" class="frequency">7.09–7.15 MHz</text>
          
            <line x1="230" y1="190" x2="782.75" y2="190" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="782.75" cy="190" r="8" fill="#5f6f79" />
            <text x="794.75" y="195" text-anchor="start" class="value" fill="#5f6f79">4.3</text>
            <line x1="230" y1="217" x2="665.5" y2="217" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="665.5,209 673.5,217 665.5,225 657.5,217" fill="#2f6f4e" />
            <text x="677.5" y="222" text-anchor="start" class="value" fill="#2f6f4e">3.6</text>
            <line x1="230" y1="244" x2="291.98" y2="244" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="283.98" y="236" width="16" height="16" rx="2" fill="#d46b28" />
            <text x="303.98" y="249" text-anchor="start" class="value" fill="#d46b28">1.37</text>
        </g>
        <g>
          <text x="44" y="333" class="band">20 m</text>
          <text x="44" y="355" class="frequency">14.175–14.178 MHz</text>
          
            <line x1="230" y1="314" x2="447.75" y2="314" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="447.75" cy="314" r="8" fill="#5f6f79" />
            <text x="459.75" y="319" text-anchor="start" class="value" fill="#5f6f79">2.3</text>
            <line x1="230" y1="341" x2="310.4" y2="341" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="310.4,333 318.4,341 310.4,349 302.4,341" fill="#2f6f4e" />
            <text x="322.4" y="346" text-anchor="start" class="value" fill="#2f6f4e">1.48</text>
            <line x1="230" y1="368" x2="285.28" y2="368" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="277.28" y="360" width="16" height="16" rx="2" fill="#d46b28" />
            <text x="297.28" y="373" text-anchor="start" class="value" fill="#d46b28">1.33</text>
        </g>
        <g>
          <text x="44" y="457" class="band">15 m</text>
          <text x="44" y="479" class="frequency">21.225 MHz</text>
          
            <line x1="230" y1="438" x2="715.75" y2="438" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="715.75" cy="438" r="8" fill="#5f6f79" />
            <text x="727.75" y="443" text-anchor="start" class="value" fill="#5f6f79">3.9</text>
            <line x1="230" y1="465" x2="315.43" y2="465" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="315.43,457 323.43,465 315.43,473 307.43,465" fill="#2f6f4e" />
            <text x="327.43" y="470" text-anchor="start" class="value" fill="#2f6f4e">1.51</text>
            <line x1="230" y1="492" x2="816.25" y2="492" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="808.25" y="484" width="16" height="16" rx="2" fill="#d46b28" />
            <text x="828.25" y="497" text-anchor="start" class="value" fill="#d46b28">4.5</text>
        </g>
        <g>
          <text x="44" y="581" class="band">10 m</text>
          <text x="44" y="603" class="frequency">28.850 MHz</text>
          
            <line x1="230" y1="562" x2="291.98" y2="562" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="291.98" cy="562" r="8" fill="#5f6f79" />
            <text x="303.98" y="567" text-anchor="start" class="value" fill="#5f6f79">1.37</text>
            <line x1="230" y1="589" x2="481.25" y2="589" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="481.25,581 489.25,589 481.25,597 473.25,589" fill="#2f6f4e" />
            <text x="493.25" y="594" text-anchor="start" class="value" fill="#2f6f4e">2.5</text>
            <line x1="230" y1="616" x2="325.48" y2="616" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="317.48" y="608" width="16" height="16" rx="2" fill="#d46b28" />
            <text x="337.48" y="621" text-anchor="start" class="value" fill="#d46b28">1.57</text>
        </g>
  <line x1="44" y1="702" x2="916" y2="702" stroke="#d9ded8" />
  
      <text x="44" y="730" class="footnote">Original: RG-316 with no confirmed choke. Replacements: RG-174 plus five ferrites; mast shifted a few feet for leg lengths.</text>
</svg>
