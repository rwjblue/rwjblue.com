<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="820" viewBox="0 0 390 820" role="img" aria-labelledby="title description">
  <title id="title">Measured in-band SWR for three Reliance OCFD wire assemblies</title>
  <desc id="description">A grouped dot plot comparing the original wire, green 80/20 replacement, and orange 64/36 replacement on 40, 20, 15, and 10 meters. Orange has the lowest measured SWR on 40 and 20 meters, green on 15 meters, and the original narrowly on 10 meters.</desc>
  <style>
    .title { font: 800 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172026; }
    .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5f6f79; }
    .legend { font: 700 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172026; }
    .tick, .frequency, .footnote { font: 700 9px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5f6f79; }
    .band { font: 800 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172026; }
    .frequency { font-size: 9px; }
    .value { font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect width="390" height="820" rx="12" fill="#fffdfa" />
  <rect x="104" y="145" width="66" height="567" fill="#edf5f0" />
  <text x="18" y="38" class="title">Measured in-band SWR</text>
  <text x="18" y="64" class="subtitle">Original wire and two untrimmed replacements</text>
  
        <circle cx="25" cy="103" r="6" fill="#5f6f79" />
        <text x="39" y="108" class="legend">Original</text>
        <polygon points="147,97 153,103 147,109 141,103" fill="#2f6f4e" />
        <text x="161" y="108" class="legend">Green 80/20</text>
        <rect x="263" y="97" width="12" height="12" rx="2" fill="#d46b28" />
        <text x="283" y="108" class="legend">Orange 64/36</text>
  <text x="137" y="163" text-anchor="middle" class="frequency" fill="#2f6f4e">≤ 2:1</text>
  
        <line x1="104" y1="145" x2="104" y2="712" stroke="#d9ded8" stroke-width="1" />
        <text x="104" y="133" text-anchor="middle" class="tick">1:1</text>
        <line x1="170" y1="145" x2="170" y2="712" stroke="#8ba79a" stroke-width="2" />
        <text x="170" y="133" text-anchor="middle" class="tick">2:1</text>
        <line x1="236" y1="145" x2="236" y2="712" stroke="#d9ded8" stroke-width="1" />
        <text x="236" y="133" text-anchor="middle" class="tick">3:1</text>
        <line x1="302" y1="145" x2="302" y2="712" stroke="#d9ded8" stroke-width="1" />
        <text x="302" y="133" text-anchor="middle" class="tick">4:1</text>
        <line x1="368" y1="145" x2="368" y2="712" stroke="#d9ded8" stroke-width="1" />
        <text x="368" y="133" text-anchor="middle" class="tick">5:1</text>
  
        <g>
          <text x="18" y="199" class="band">40 m</text>
          <text x="18" y="221" class="frequency">7.09–7.15 MHz</text>
          
            <line x1="104" y1="180" x2="321.8" y2="180" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="321.8" cy="180" r="7" fill="#5f6f79" />
            <text x="333.8" y="185" text-anchor="start" class="value" fill="#5f6f79">4.3</text>
            <line x1="104" y1="207" x2="275.6" y2="207" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="275.6,200 282.6,207 275.6,214 268.6,207" fill="#2f6f4e" />
            <text x="287.6" y="212" text-anchor="start" class="value" fill="#2f6f4e">3.6</text>
            <line x1="104" y1="234" x2="128.42" y2="234" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="121.42" y="227" width="14" height="14" rx="2" fill="#d46b28" />
            <text x="140.42" y="239" text-anchor="start" class="value" fill="#d46b28">1.37</text>
        </g>
        <g>
          <text x="18" y="336" class="band">20 m</text>
          <text x="18" y="358" class="frequency">14.175–14.178 MHz</text>
          
            <line x1="104" y1="317" x2="189.8" y2="317" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="189.8" cy="317" r="7" fill="#5f6f79" />
            <text x="201.8" y="322" text-anchor="start" class="value" fill="#5f6f79">2.3</text>
            <line x1="104" y1="344" x2="135.68" y2="344" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="135.68,337 142.68,344 135.68,351 128.68,344" fill="#2f6f4e" />
            <text x="147.68" y="349" text-anchor="start" class="value" fill="#2f6f4e">1.48</text>
            <line x1="104" y1="371" x2="125.78" y2="371" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="118.78" y="364" width="14" height="14" rx="2" fill="#d46b28" />
            <text x="137.78" y="376" text-anchor="start" class="value" fill="#d46b28">1.33</text>
        </g>
        <g>
          <text x="18" y="473" class="band">15 m</text>
          <text x="18" y="495" class="frequency">21.225 MHz</text>
          
            <line x1="104" y1="454" x2="295.4" y2="454" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="295.4" cy="454" r="7" fill="#5f6f79" />
            <text x="307.4" y="459" text-anchor="start" class="value" fill="#5f6f79">3.9</text>
            <line x1="104" y1="481" x2="137.66" y2="481" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="137.66,474 144.66,481 137.66,488 130.66,481" fill="#2f6f4e" />
            <text x="149.66" y="486" text-anchor="start" class="value" fill="#2f6f4e">1.51</text>
            <line x1="104" y1="508" x2="335" y2="508" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="328" y="501" width="14" height="14" rx="2" fill="#d46b28" />
            <text x="347" y="513" text-anchor="start" class="value" fill="#d46b28">4.5</text>
        </g>
        <g>
          <text x="18" y="610" class="band">10 m</text>
          <text x="18" y="632" class="frequency">28.850 MHz</text>
          
            <line x1="104" y1="591" x2="128.42" y2="591" stroke="#5f6f79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <circle cx="128.42" cy="591" r="7" fill="#5f6f79" />
            <text x="140.42" y="596" text-anchor="start" class="value" fill="#5f6f79">1.37</text>
            <line x1="104" y1="618" x2="203" y2="618" stroke="#2f6f4e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <polygon points="203,611 210,618 203,625 196,618" fill="#2f6f4e" />
            <text x="215" y="623" text-anchor="start" class="value" fill="#2f6f4e">2.5</text>
            <line x1="104" y1="645" x2="141.62" y2="645" stroke="#d46b28" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
            <rect x="134.62" y="638" width="14" height="14" rx="2" fill="#d46b28" />
            <text x="153.62" y="650" text-anchor="start" class="value" fill="#d46b28">1.57</text>
        </g>
  <line x1="18" y1="740" x2="372" y2="740" stroke="#d9ded8" />
  
      <text x="18" y="762" class="footnote">Original: RG-316, no confirmed choke.</text>
      <text x="18" y="782" class="footnote">Replacements: RG-174 + five ferrites;</text>
      <text x="18" y="802" class="footnote">mast shifted a few feet for leg lengths.</text>
</svg>
