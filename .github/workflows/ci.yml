name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install project dependencies
        run: mise run install

      - name: Sync Astro types
        run: mise run check

      - name: Test private training and shared infrastructure
        run: node --experimental-strip-types --test tests/cw-training-*.test.mjs tests/cw-practice.test.mjs tests/offline.test.mjs tests/discovery.test.mjs

      - name: Check private training types
        run: npm run check:training

      - name: Build site
        run: mise run build
