name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install project dependencies
        run: mise run install

      - name: Sync Astro types
        run: mise run check

      - name: Test private training and shared infrastructure
        run: node --experimental-strip-types --test tests/cw-training-*.test.mjs tests/web-morse-runner-vendor.test.mjs tests/cw-practice.test.mjs tests/offline.test.mjs tests/discovery.test.mjs

      - name: Check private training types
        run: npm run check:training

      - name: Build site
        run: mise run build
